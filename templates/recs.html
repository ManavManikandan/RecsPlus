<!DOCTYPE html>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap');
</style>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RecsPlus - Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
</head>

<header>
    <div id="top-header">
        <div id="logo">
            <img src="{{ url_for('static', filename='R+.png') }}">
            <h2 id="header-text">
                RecsPlus
            </h2>
        </div>

        <div class="menu-toggle" onclick="toggleMenu()">
            <i class="uil uil-bars"></i>
        </div>

        <nav id="menu">
            <ul>
                <li class="active">
                    <a href="home">Home</a>
                </li>
                <li>
                    <a href="/">Get Recs</a>
                </li>
                <li>
                    <a href="#">Privacy Policy</a>
                </li>
                <li>
                    <a href="#">Log Out</a>
                </li>
            </ul>
        </nav>
    </div>
</header>


<body>
    
    <div class="results-box-one">
        <h1>
            Recommendations for
            <span id="track-info-text"></span>
        </h1>
        <button id="playlist-button" onclick="makePlaylist()">
            Make a Playlist
        </button>
        <iframe id="embed" 
            width="100%" height="500" frameBorder="0" allowtransparency="true" allow="encrypted-media" style="display: none;">
        </iframe>
        <div id="list-div">
            <ul id="tracks-list">
            </ul>
        </div>
    </div>

</body>

<style>

html, body{
    height: 100%;
    font-family: "lexend-deca", sans-serif;
}
    
body{
    margin: 0px;
    padding: 10px;
    background: #161616;
    font-family: "lexend-deca", sans-serif;
    font-size: 12pt;
}
        
h1, h2, h3{
    margin: 0;
    padding: 0;
    color: #FFFFFF;
}
    
p, ol, ul{
    margin-top: 0;
}

p {
    line-height: 180%;
}

ol, ul{
    padding: 0;
    list-style: none;
}
    
.container{    
    /* Set width of container to 
        1200px and align center */
    margin: 0px auto;
    width: 1200px;
    z-index: 3;
}


header{
    overflow: hidden;
    width: 100%;
    height: clamp(44px, 4vw, 4vw);
    padding: 8px 0px;
}

#top-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    background: #161616;
    z-index: 3;
    width: auto;

}

#header-text {
}
 
#logo{
    display: flex;
    align-items: center;
    font-size: clamp(10pt, 4vw, 34px);
}

#logo img {
    width: auto;
    height: auto;
    max-height: 40px;
    max-width: 100%;
    margin-right: 5px;
    border-width: 1px;
    border-color: #FFF;
    border-style: solid;
}
 
.menu-toggle {
    display: none;
    font-size: 2em;
    color: #FFF;
    float: right;
}

#menu ul{
    text-align: center;
    float: right;
    margin: 0px;
    background: #161616;

}

#menu li a, #menu li span{
    display: inline-block;
    padding: 0em 1.5em;
    text-decoration: none;
    font-weight: 600;
    text-transform: uppercase;
    line-height: 60px;
    font-family: "lexend-deca", sans-serif;
    letter-spacing: 1px;
}

#menu li a{
    color: #FFF;
}

#menu li:hover a, #menu li span{
    background: #FFF;
    color: #161616;
    border-left: 1px solid #161616;
    text-decoration: none;
}

#menu{
    display: flex; 
    align-items: center;
    justify-content: flex-end;
    flex: 1 1;
}
    
#menu ul{
    text-align: center;
    float: right;
    margin: none;
    background: #161616;
}
    
.menu-toggle {
    display: none;
}

#menu li{
    display: inline-block;
    padding: none;
    margin: none;
}

@media (min-width: 800px) {
    #menu{
        display: flex; 
        align-items: center;
        justify-content: flex-end;
        flex: 1 1;
    }
        
    #menu ul{
        text-align: center;
        float: right;
        margin: none;
        background: #161616;
        font-size: clamp(12pt, 100%, 30pt);
    }
        
    .menu-toggle {
        display: none;
    }

    #menu li{
        display: inline-block;
        padding: none;
        margin: none;
    }
        

}

@media (max-width: 800px) {
    .menu-toggle {
        display: block;
        float: right;
    }

    #menu {
        display: none;
        max-width: 0px;
        position: absolute;
        top: 0.5%;
        left: 100%;
    }

    #menu ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        position: absolute;
        top: 60px;
        min-width: 160px;
        z-index: 100;
    }

    #menu li {
        white-space: nowrap;
    }


    #logo {
        font-size: clamp(20pt, 5vw, 20pt);
        float: right;
    }

    body::-webkit-scrollbar {
        display: none;
    }
    body {
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

}


/* results box one */

.results-box-one {
    background: #292929;
    padding: 10px;
    height: auto;
    width: auto;
    display: block;
    text-align: center;
    font-family: "lexend-deca", sans-serif;
}

#list-div {
    
}

h1 {
    margin: 10px;
}

.results-box-one button {
    color: #FFFFFF;
    background: #185ADB;
    border: 1px solid #185ADB;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18pt;
    height: auto;
    padding: 8px;
    font-family: "lexend-deca", sans-serif;
    font-weight: 800;
    margin: 10px;

}

#list-div ul {
    -moz-column-count: 4;
    -moz-column-gap: 10px;
    -webkit-column-count: 4;
    -webkit-column-gap: 10px;
    column-count: 4;
    column-gap: 10px;
    text-align: left;

}

#list-div ul li {
    color: #fff;
    font-size: 14pt;
}

.list-title {
    font-weight: 700;
    margin: 0px;
    font-size: 16pt;
}

.list-artist {
    font-weight: 300;
    font-size: 12pt;
    white-space: nowrap;
}

#embed {
    margin: 20px 0px; 

}

@media (max-width: 800px) {
    #list-div ul {
        -moz-column-count: 1;
        -moz-column-gap: 10px;
        -webkit-column-count: 1;
        -webkit-column-gap: 10px;
        column-count: 1;
        column-gap: 10px;
        text-align: left;
    }


}

</style>

<script>

const spanID = document.getElementById("track-info-text");
spanID.textContent = (spanID.textContent || '') +  sessionStorage.getItem("track") + ' by ' + sessionStorage.getItem("artist");


const recsJSON = sessionStorage.getItem("recommendations");
const recs = JSON.parse(recsJSON);

for (let i = 0; i < recs.length; i++) {
    const list = document.getElementById("tracks-list");
    const li = document.createElement('li');
    const p1 = document.createElement('p');
    const p2 = document.createElement('p');
    p1.classList.add('list-title');
    p2.classList.add('list-artist');
    p1.textContent = recs[i].songName;
    p2.textContent = recs[i].artistName;
    li.append(p1);
    li.append(p2);
    list.append(li);
}

function makePlaylist() {
    
    fetch('/playlist', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            recs: recs,
            track: sessionStorage.getItem("track"),
            artist: sessionStorage.getItem("artist")
        })
    })

    .then(response => response.json())
    .then(json => {  
        embedDiv = document.getElementById("embed");
        embedDiv.style.display = 'block';
        embedDiv.src = json.URL;
        embedDiv.src = embedDiv.src;
        return;
    })
    .catch(error => {
        console.error('Error:', error);
    });

}

function toggleMenu() {
    const menu = document.getElementById("menu");
    if (menu.style.display === "flex") {
        menu.style.display = "none";
    } else {
        menu.style.display = "flex";
    }
}


</script>
